repo: "."
ignore:
  # Dependencies and tooling
  # Any-depth forms: a monorepo's sub-app carries its own node_modules/dist,
  # and root-anchored globs let a nested tree straight into the graph (a
  # production monolith's sub-app node_modules contributed ~880k facts).
  - "**/vendor/**"
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/tmp/**"
  - "**/public/assets/**"
  - ".enola/**"
  # And at any depth: a cluster config that snapshots subdirectories leaves an
  # output directory in each, and enola then indexes its own llm_context.md.
  - "**/.enola/**"
  # Go reserves testdata/ for fixtures and never compiles it. Fixture repos are
  # miniature codebases, so indexing them injects their routes and client call
  # sites into the host repo's graph. Kept in sync with config.Default().
  - "**/testdata/**"
  # Python virtual environments, installed dependencies, and tool caches. A
  # repo-local .venv/venv holds the whole dependency tree (thousands of
  # third-party .py files) and must never be indexed — it dominates snapshot
  # time. site-packages is the definitive catch for any oddly-named env
  # (.tox/.nox/conda/direnv all nest one). Kept in sync with config.Default().
  - "**/.venv/**"
  - "**/venv/**"
  - "**/site-packages/**"
  - "**/.tox/**"
  - "**/.nox/**"
  - "**/.eggs/**"
  - "**/__pycache__/**"
  - "**/.mypy_cache/**"
  - "**/.pytest_cache/**"
  - "**/.ruff_cache/**"
  # Tests
  - "**/*_test.go"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  # Ember's convention is a HYPHENATED suffix under tests/ (ember-cli generates
  # and qunit discovers tests/**/*-test.*). The directory is demanded for the
  # same reason as Ruby's below: a bare "**/*-test.ts" also swallows production
  # code that merely ends in the token (an experimentation util named ab-test.ts).
  - "**/tests/**/*-test.js"
  - "**/tests/**/*-test.ts"
  - "**/tests/**/*-test.gjs"
  - "**/tests/**/*-test.gts"
  # Ruby has no co-located test convention (RSpec requires spec/, Minitest
  # defaults to test/), so these demand the directory as well as the filename: a
  # bare "**/*_test.rb" also swallows production code that merely ends in the
  # token. Kept in sync with config.Default().
  - "**/spec/**/*_spec.rb"
  - "**/test/**/*_test.rb"
  # Python. A pytest fixture that assembles a throwaway app is a route-mount
  # fact, and the repo-wide prefix fixpoint folds every mount it can see — so a
  # test-only prefix rewrites production routes. conftest.py and the test_ prefix
  # are pytest-reserved; a whole tests/ tree goes too, since fixtures and
  # factories carry no test_ prefix. Kept in sync with config.Default().
  - "**/conftest.py"
  - "**/test_*.py"
  - "**/tests/**/*.py"
  - "**/test/**/*.py"
  # Next.js / build and cache
  - ".next/**"
  - "out/**"
  - ".vercel/**"
  - ".turbo/**"
  - "dist/**"
  - "coverage/**"
  - ".nuxt/**"
  - ".svelte-kit/**"
  # Rust / Maven / Gradle build output, at any depth.
  - "**/target/**"
  # .NET build output, at any depth (one obj/bin pair per project). obj/ holds
  # generated C# — GlobalUsings.g.cs, AssemblyInfo.cs, source-generator output —
  # and is not a source convention elsewhere. bin/ IS one (bin/cli.js), so only
  # .NET's own configuration subdirectories are excluded.
  - "**/obj/**"
  - "**/bin/Debug/**"
  - "**/bin/Release/**"
  # C# tests. Directory-scoped and deliberately WITHOUT a filename pattern:
  # `**/*Test.cs` would delete XmlQualifiedNameTest, a real XPath node-test type.
  # `*.Tests/` is not redundant — a .NET test project usually sits beside its app
  # rather than under a tests/ directory.
  - "**/tests/**/*.cs"
  - "**/test/**/*.cs"
  - "**/Tests/**/*.cs"
  - "**/Test/**/*.cs"
  - "**/*.Tests/**/*.cs"
  - "**/tests/**/*.fs"
  - "**/test/**/*.fs"
  - "**/Tests/**/*.fs"
  - "**/Test/**/*.fs"
  - "**/*.Tests/**/*.fs"
  - "**/tests/**/*.vb"
  - "**/test/**/*.vb"
  - "**/Tests/**/*.vb"
  - "**/Test/**/*.vb"
  - "**/*.Tests/**/*.vb"
  # Razor markup in the same test trees: a test project's .razor/.cshtml reference
  # production members exactly as a test .cs does, so indexing them would vouch for
  # symbols no production code uses.
  - "**/tests/**/*.razor"
  - "**/test/**/*.razor"
  - "**/Tests/**/*.razor"
  - "**/Test/**/*.razor"
  - "**/*.Tests/**/*.razor"
  - "**/tests/**/*.cshtml"
  - "**/test/**/*.cshtml"
  - "**/Tests/**/*.cshtml"
  - "**/Test/**/*.cshtml"
  - "**/*.Tests/**/*.cshtml"
  - "**/tests/**/*.xaml"
  - "**/test/**/*.xaml"
  - "**/Tests/**/*.xaml"
  - "**/Test/**/*.xaml"
  - "**/*.Tests/**/*.xaml"
  - "**/tests/**/*.axaml"
  - "**/test/**/*.axaml"
  - "**/Tests/**/*.axaml"
  - "**/Test/**/*.axaml"
  - "**/*.Tests/**/*.axaml"
  # Scala test source sets. Scoped to the source set, never a directory merely
  # named `test`: a one-segment "**/test/**/*.scala" deletes zio's own test
  # library (test-magnolia/src/main/.../zio/test/), which is production code.
  - "**/src/test/**/*.scala"
  - "**/src/it/**/*.scala"
  - "**/src/multi-jvm/**/*.scala"
  # Dart tests. Directory-scoped, like Ruby's and C#'s: pub puts them under a
  # package's test/ directory, and a bare "**/*_test.dart" would also swallow
  # production files that merely end in the token.
  - "**/test/**/*.dart"
  - "**/integration_test/**/*.dart"
  - "**/test_driver/**/*.dart"
  # Dart code generation output. build_runner output is the MAJORITY of files in a
  # real Flutter project and none of it is code a human navigates: one @freezed
  # model yields hundreds of generated lines of copyWith/== plus a .g.dart of
  # serialization. Indexing it inflates symbol counts and manufactures god-class
  # and complexity findings about machine output.
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "**/*.mocks.dart"
  - "**/*.gr.dart"
  - "**/*.config.dart"
  - "**/*.pb.dart"
  - "**/*.pbenum.dart"
  - "**/*.pbjson.dart"
  - "**/*.pbserver.dart"
  - "**/*.pbgrpc.dart"
  # Dart/Flutter build and package caches.
  - "**/.dart_tool/**"
  - "**/.pub-cache/**"
  - "**/.flutter-plugins"
  - "**/.flutter-plugins-dependencies"
  # The Dart SDK's own parser fixtures and language suite are programs DESIGNED to
  # be rejected (trailing_comma_error_test.dart and thousands of neighbours), so
  # they would otherwise be counted as parse failures against the grammar.
  - "**/pkg/front_end/testcases/**"
  - "**/pkg/_fe_analyzer_shared/test/**"
  # Minified / bundled JS (also detected heuristically by the extractor; kept in
  # sync with config.Default() in internal/config/config.go)
  - "**/*.min.js"
  - "**/*.bundle.js"
  # Files `enola install` owns (config.InstalledFiles). Normalize adds these to any
  # config, so they are listed here only to keep this file equal to the defaults.
  - "**/.claude/rules/**/enola.md"
  - "**/.cursor/rules/**/enola.mdc"
  - "**/.github/instructions/**/enola.instructions.md"
  - "**/.opencode/**/enola.md"
  - "**/.opencode/plugin/**/enola.js"
  - "**/.pi/extensions/**/enola.js"
  # Documentation
  - "**/*.md"
  - "**/*.mdx"
  # Config / data (YAML, JSON)
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.json"
  # CI / ops
  - "Jenkinsfile"
  - "**/Jenkinsfile"
  - "**/Jenkinsfile*"
  # Optional: Docker and env files
  - "Dockerfile"
  - "**/Dockerfile*"
  - "**/.env*"
  # Kotlin / Android build and cache
  - "build/**"
  - "**/build/**"
  - ".gradle/**"
  - "**/.gradle/**"
  - "**/generated/**"
  # Kotlin tests
  - "**/*Test.kt"
  - "**/androidTest/**"
  # Swift / Xcode build and cache
  - "DerivedData/**"
  - "**/DerivedData/**"
  - "*.xcodeproj/**"
  - "*.xcworkspace/**"
  - "Pods/**"
  - "**/Pods/**"
  - ".build/**"
  - "**/.build/**"
  # SPM/Xcode build & package artifacts at any depth (basename match — the
  # **/x/** form above only catches top-level occurrences), plus timestamped
  # backup dirs like .build.bak-YYYYMMDD / .swiftpm.bak-YYYYMMDD.
  - "**/.build"
  - "**/.swiftpm"
  - "**/*.bak-*"
  # Swift tests
  - "**/*Tests.swift"
  - "**/*Test.swift"
  # Ruby / Rails
  - "**/spec/**/*_spec.rb"
  - "**/test/**/*_test.rb"
  - "tmp/**"
  - "log/**"
  - "public/assets/**"
  - "public/packs/**"
  # PHP tests (PHPUnit / Pest / Codeception). Excluded so test request
  # simulations (e.g. Symfony WebTestCase `$client->request(...)`) are not
  # indexed as production routes/clients, and the fact graph stays focused.
  - "tests/**"
  - "**/*Test.php"
  - "**/*TestCase.php"
  - "**/*Cest.php"
# extractors: / explainers: / renderers: are deliberately ABSENT.
#
# Each of these keys REPLACES the built-in list rather than extending it, so a
# file that merely mirrors config.Default() can do only one thing: fall behind it.
# This file used to list eleven extractors, which silently disabled Rust for every
# repository it governed from the day the Rust extractor landed — and because a
# config beside the binary also applies to repositories elsewhere, that reached far
# past this one. Omitting the keys means new extractors, explainers and renderers
# are picked up automatically.
#
# Set them only to genuinely narrow a run (e.g. `extractors: [go]` to index Go
# alone). enola warns when an extractor you excluded would have detected the repo.
output:
  dir: ".enola"
  max_context_tokens: 4000
# incremental: true   # reuse each extractor's cached facts when its files are unchanged (default: true)
