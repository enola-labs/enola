version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

    # Grammar bumps are grouped into a single PR on purpose. Any grammar change
    # invalidates the extractor cache, so each one landing separately would make
    # every user pay for a full re-extraction to arrive at the same graph. One
    # group is one cacheVersion bump (see internal/engine/cache.go).
    groups:
      tree-sitter:
        patterns:
          - "github.com/tree-sitter/*"
          - "github.com/tree-sitter-grammars/*"

    # The tree-sitter grammars are capped by ABI, not by preference.
    #
    # The go-tree-sitter runtime this module vendors accepts tree-sitter ABI 13-14.
    # A grammar generated against ABI 15 is refused by SetLanguage, and every
    # extractor returns nil on that error — so the rejection is SILENT: each file of
    # that language parses to nothing, and the fact graph becomes indistinguishable
    # from a repository containing none of it. That has already happened once, to C#
    # (see internal/extractors/dotnetextractor/csharp.go).
    #
    # Upstream has been regenerating grammars at ABI 15 since 2025, so for most
    # languages the NEWEST release is the unusable one. Each bound below is that
    # language's last ABI-14 release; dependabot will now offer the highest version
    # that actually loads instead of the highest that exists.
    #
    # Verify a bound with:
    #   grep -m1 'define LANGUAGE_VERSION' $(go env GOMODCACHE)/<module>@<version>/src/parser.c
    #
    # Raising any of these requires raising the runtime first — and see the
    # go-tree-sitter note below for why that is not currently possible.
    ignore:
      # NOT a normal ABI bound. go-tree-sitter v0.25.0 would raise the ceiling to
      # ABI 15 and unblock every entry below it, and it stays backward compatible
      # (MIN_COMPATIBLE 13), so a bump to it passes CI green. It is excluded because
      # the upstream v0.25.0 TAG WAS DELETED: `git ls-remote` lists only v0.23.0,
      # v0.23.1 and v0.24.0, and the GitHub ref API returns 404. Only the Go module
      # proxy's immutable cache still serves it, so adopting it would break every
      # build that does not go through proxy.golang.org (GOPROXY=direct, vendored,
      # air-gapped) while pinning the project to a release its maintainers withdrew.
      # Revisit if upstream publishes a real release above v0.24.0.
      - dependency-name: "github.com/tree-sitter/go-tree-sitter"
        versions: [">= 0.25.0"]

      # v0.24.0+ are ABI 15. Last ABI-14 release: v0.23.6.
      - dependency-name: "github.com/tree-sitter/tree-sitter-c"
        versions: [">= 0.24.0"]

      # v0.23.2+ are ABI 15. Last ABI-14 release: v0.23.1 — the version pinned today,
      # and the grammar whose silent failure this whole policy exists to prevent.
      - dependency-name: "github.com/tree-sitter/tree-sitter-c-sharp"
        versions: [">= 0.23.2"]

      # v0.24.0+ are ABI 15. Last ABI-14 release: v0.23.12.
      - dependency-name: "github.com/tree-sitter/tree-sitter-php"
        versions: [">= 0.24.0"]

      # v0.25.0+ are ABI 15. Last ABI-14 release: v0.23.6 — the version pinned today.
      - dependency-name: "github.com/tree-sitter/tree-sitter-python"
        versions: [">= 0.25.0"]

      # v0.24.0+ are ABI 15. Last ABI-14 release: v0.23.3 — the version pinned today.
      - dependency-name: "github.com/tree-sitter/tree-sitter-rust"
        versions: [">= 0.24.0"]

      # No bound for tree-sitter-cpp, -java, -ruby, -typescript or
      # tree-sitter-kotlin: their newest releases are still ABI 14. When upstream
      # regenerates one at ABI 15, the TestGrammarSmoke probe in that extractor's
      # package fails the PR, and the fix is to add its bound here.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    # One PR for all action bumps rather than one per action. These are almost
    # always shared runtime moves (the node20 -> node24 wave took five separate
    # PRs), and CI grades them as a set anyway.
    groups:
      github-actions:
        patterns:
          - "*"
